[workspace]
authors = ["Andrew Jensen <contact@ajensen.org>", "Paris Flood <paris@orthodriven.com>"]
channels = ["conda-forge"]
name = "2d-point-annotator"
platforms = ["linux-64", "win-64", "osx-arm64"]
version = "3.0.0"

[tasks]
annotator = {cmd = "python ./src/main.py"}
test = {cmd = "python -m pytest tests/ -v -s"}
test-onedrive = {cmd = "python -m pytest tests/test_onedrive_upload.py -v -s"}
test-onedrive-quick = {cmd = "python tests/test_onedrive_upload.py"}

fc-cache = { cmd = "fc-cache -r", env = { FONTCONFIG_PATH = "$CONDA_PREFIX/etc/fonts", FC_CONFIG_FILE = "$CONDA_PREFIX/etc/fonts/fonts.conf" } }

# Quick check: prove the env can see DejaVu.
fc-check = { cmd = "bash -lc 'fc-list | grep -i dejavu | head -n 20'", env = { FONTCONFIG_PATH = "$CONDA_PREFIX/etc/fonts", FC_CONFIG_FILE = "$CONDA_PREFIX/etc/fonts/fonts.conf" } }

run = { cmd = "python src/main.py", env = { FONTCONFIG_PATH = "$CONDA_PREFIX/etc/fonts", FC_CONFIG_FILE = "$CONDA_PREFIX/etc/fonts/fonts.conf" } }

generate-groups = { cmd = "python scripts/generate_study_groups.py --all", description = "Generate annotation group files from studies.json" }

gto-register = { cmd = "sh -c 'gto register \"$1\" $(jj log -r @ --no-graph -T commit_id) \"${@:2}\"' _", description = "gto register at jj @ instead of HEAD" }
gto-assign = { cmd = "sh -c 'gto assign \"$1\" --stage \"$2\" --rev $(jj log -r @ --no-graph -T commit_id) \"${@:3}\"' _", description = "gto assign at jj @ instead of HEAD" }

[dependencies]
numpy = ">=2.3.5,<3"
pandas = ">=2.3.3,<3"
pillow = ">=12.0.0,<13"
opencv = ">=4.12.0,<5"
python = ">=3.13.11,<3.14"
fontconfig = ">=2.15.0,<3"
freetype = ">=2.14.1,<3"
xorg-libxrender = ">=0.9.12,<0.10"
font-ttf-roboto = ">=3.15,<4"
open-fonts = ">=0.7.0,<0.8"
font-ttf-dejavu-sans-mono = ">=2.37,<3"
font-ttf-dejavu = ">=2.37,<3"
tk = ">=8.6.13,<9"
polars = ">=1.37.1,<2"
sqlite = ">=3.51.2,<4"
msgraph-sdk = ">=1.48.0,<2"
pytest = ">=8.0.0,<9"
requests = ">=2.32.5,<3"
packaging = ">=26.0,<27"
platformdirs = ">=4.5.1,<5"
gto = ">=1.9.0,<2"
pyyaml = ">=6.0.3,<7"

[target.linux-64.dependencies]
xorg-libxft = ">=2.3.9,<3"
xorg-libx11 = ">=1.8.12,<2"
xorg-libxext = ">=1.3.6,<2"

[pypi-dependencies]
ultralytics = ">=8.3, <9"
onnx = ">=1.16, <2"
onnxruntime = ">=1.18, <2"
pydicom = ">=2.4, <4"
nibabel = ">=5.2, <6"
